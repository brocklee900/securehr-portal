jenkins:
  systemMessage: "SecureHR CI"
  securityRealm:
    oic:
      clientId: jenkins
      clientSecret: ${JENKINS_OIDC_SECRET}
      serverConfiguration:
        wellKnown:
          wellKnownOpenIDConfigurationUrl: https://auth.localhost/realms/securehr/.well-known/openid-configuration
      userNameField: preferred_username
      groupsFieldName: roles
      logoutFromOpenidProvider: true
  authorizationStrategy:
    roleBased:
      roles:
        global:
          - name: admin
            permissions:
              - Overall/Administer
            entries:
              - group: hr_admin
              - user: alice.hr
          - name: dev
            permissions:
              - Overall/Read
              - Job/Build
              - Job/Read
            entries:
              - group: manager
              - group: employee
unclassified:
  location:
    url: https://jenkins.localhost/