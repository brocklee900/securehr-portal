events {}
http {
  ssl_certificate     /etc/nginx/certs/securehr.pem;
  ssl_certificate_key /etc/nginx/certs/securehr-key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host $host;
  proxy_buffer_size 128k;
  proxy_buffers 4 256k;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server { listen 80 default_server; return 301 https://$host$request_uri; }

  server {
    listen 443 ssl;
    server_name portal.localhost;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    location /api/ {
      proxy_pass http://backend:8000/;
    }
    location / {
      proxy_pass http://frontend:5173;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header Upgrade $http_upgrade;       # Vite HMR websocket
      proxy_set_header Connection $connection_upgrade;
    }
  }

  server {
    listen 443 ssl;
    server_name auth.localhost;
    location / { proxy_pass http://keycloak:8080; }
  }

  server {
    listen 443 ssl;
    server_name jenkins.localhost;
    location / { proxy_pass http://jenkins:8080; }
  }
}
