# Operational definition of a valid search at the edge: a GET to the exact
# directory endpoint with a bearer credential, excluding auth/input rejections.
# Do not exclude 5xx: Nginx failures must count even when the backend is down.
map $http_authorization $search_has_bearer {
  default 0;
  "~*^Bearer\s+\S+$" 1;
}
map $status $search_rejected {
  default 0;
  400 1;
  401 1;
  403 1;
  404 1;
  405 1;
  413 1;
  414 1;
  422 1;
}
map "$request_method:$uri:$search_has_bearer:$search_rejected" $employee_search_eligible {
  default 0;
  "GET:/api/employees:1:0" 1;
}
# A fixed request path supplies the exporter's method label without logging q.
log_format employee_search '"GET /api/employees HTTP/1.1" $status $body_bytes_sent $request_time';
map $uri $portal_route {
  default other;
  /api/employees employee_search;
  /api/health health;
}
log_format portal_upstream escape=json
  '{"time":"$time_iso8601","request_id":"$request_id",'
  '"route":"$portal_route","method":"$request_method","status":$status,'
  '"slo_eligible":$employee_search_eligible,"request_time":$request_time,'
  '"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status",'
  '"upstream_connect_time":"$upstream_connect_time",'
  '"upstream_header_time":"$upstream_header_time",'
  '"upstream_response_time":"$upstream_response_time"}';
