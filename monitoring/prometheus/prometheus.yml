global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: securehr
rule_files:
  - /etc/prometheus/rules/*.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: nginx-search
    static_configs:
      - targets: [nginx-log-exporter:4040]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
