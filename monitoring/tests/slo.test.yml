{
  "rule_files": [
    "/etc/prometheus/rules/employee-search.yml"
  ],
  "evaluation_interval": "1m",
  "tests": [
    {
      "name": "healthy traffic",
      "interval": "1m",
      "input_series": [
        {
          "series": "securehr_search_http_response_count_total{job=\"nginx-search\",status=\"200\"}",
          "values": "0+1000x60"
        },
        {
          "series": "securehr_search_http_response_time_seconds_hist_bucket{job=\"nginx-search\",le=\"0.5\",status=\"200\"}",
          "values": "0+1000x60"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "60m",
          "alertname": "EmployeeSearchSLOBurnRate",
          "exp_alerts": []
        }
      ],
      "promql_expr_test": [
        {
          "expr": "securehr:employee_search:burn_rate_5m",
          "eval_time": "60m",
          "exp_samples": [
            {
              "labels": "{__name__=\"securehr:employee_search:burn_rate_5m\"}",
              "value": 0
            }
          ]
        },
        {
          "expr": "securehr:employee_search:good_ratio_30d",
          "eval_time": "60m",
          "exp_samples": [
            {
              "labels": "{__name__=\"securehr:employee_search:good_ratio_30d\"}",
              "value": 1
            }
          ]
        }
      ]
    },
    {
      "name": "two percent slow successes page",
      "interval": "1m",
      "input_series": [
        {
          "series": "securehr_search_http_response_count_total{job=\"nginx-search\",status=\"200\"}",
          "values": "0+1000x60"
        },
        {
          "series": "securehr_search_http_response_time_seconds_hist_bucket{job=\"nginx-search\",le=\"0.5\",status=\"200\"}",
          "values": "0+980x60"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "60m",
          "alertname": "EmployeeSearchSLOBurnRate",
          "exp_alerts": [
            {
              "exp_labels": {
                "severity": "page",
                "service": "securehr",
                "slo": "employee-search"
              },
              "exp_annotations": {
                "summary": "Employee directory search is burning its error budget",
                "description": "Both the 1-hour and 5-minute burn rates reached 14.4 for the 99.9% SLO (status below 500 AND response within 500 ms).",
                "runbook": "docs/MONITORING.md#incident-runbook",
                "first_step": "Inspect Nginx upstream logs and PostgreSQL query latency."
              }
            }
          ]
        }
      ],
      "promql_expr_test": [
        {
          "expr": "securehr:employee_search:burn_rate_5m",
          "eval_time": "60m",
          "exp_samples": [
            {
              "labels": "{__name__=\"securehr:employee_search:burn_rate_5m\"}",
              "value": 20
            }
          ]
        },
        {
          "expr": "securehr:employee_search:good_ratio_30d",
          "eval_time": "60m",
          "exp_samples": [
            {
              "labels": "{__name__=\"securehr:employee_search:good_ratio_30d\"}",
              "value": 0.98
            }
          ]
        }
      ]
    },
    {
      "name": "fast 5xx only with no successful series still page",
      "interval": "1m",
      "input_series": [
        {
          "series": "securehr_search_http_response_count_total{job=\"nginx-search\",status=\"502\"}",
          "values": "0+1000x60"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "60m",
